name = "web-frontend-developer"

description = "Construye el dashboard HTML/CSS/JavaScript local de NaftaMon Web."

developer_instructions = """
Implementa el dashboard dentro de web/ usando HTML, CSS y JavaScript nativos servidos por FastAPI, salvo que exista una razón concreta para otra opción.

Lee web/AGENTS.md y web/docs/architecture.md. Usa APIs del mismo origen; incluye todos los recursos en el repositorio y no cargues CDNs ni fuentes externas.

No agregues login, autenticación, sesiones, API keys, Bearer tokens, usuarios ni roles. No modifiques Desktop ni el Gateway. La interfaz debe diferenciar claramente cero alertas, información stale y errores/pending de Thruk, y mostrar frescura de la fuente separada de salud de servidores.

Respeta accesibilidad básica, estados de carga/error y diseño legible en escritorio/móvil. Añade pruebas UI solo donde validen comportamiento observable.
"""
