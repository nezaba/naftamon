services:
  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-8388608}
      OFFLINE_AFTER_SECONDS: ${OFFLINE_AFTER_SECONDS:-900}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-90}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8000"
    volumes:
      - naftamon_web_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      DATA_DIR: /tmp/naftamon-web-tests
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-8388608}
      OFFLINE_AFTER_SECONDS: ${OFFLINE_AFTER_SECONDS:-900}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-90}
    command: ["python", "-m", "pytest", "-q", "tests"]

volumes:
  naftamon_web_data:
